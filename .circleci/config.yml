version: 2.1
orbs:
  go: circleci/go@3.0.4

jobs:
  test:
    resource_class: large
    executor:
      name: go/default
      tag: "1.24.13"
    steps:
      - checkout
      - go/load-build-cache
      - go/mod-download
      - run:
          command: make setup-envtest
      - go/save-build-cache
      - go/save-mod-cache
      - run:
          command: make test

  build:
    resource_class: large
    machine:
      image: "ubuntu-2404:2025.09.1"
    environment:
      ALL_ARCH: "amd64 arm64"
      REGISTRY_AZURE: gsoci.azurecr.io/giantswarm
      REGISTRY_CHINA: giantswarm-registry.cn-shanghai.cr.aliyuncs.com/giantswarm
    steps:
      - checkout

      - run:
          name: Ensure 'make generate' matches commit
          command: |
            make generate
            git diff --exit-code || { echo "There are differences in generated files. Please run and commit 'make generate'. Else we can run into CRDs mismatching the code."; exit 1; }

      - run:
          name: Build the CAPA docker images
          command: |
            for registry in $REGISTRY_AZURE $REGISTRY_CHINA; do
              make docker-build-all ALL_ARCH="$ALL_ARCH" TAG=$CIRCLE_SHA1 REGISTRY=$registry

              if [ -n "$CIRCLE_TAG" ]; then
                echo "Building tag $CIRCLE_TAG"
                make docker-build-all ALL_ARCH="$ALL_ARCH" TAG="$CIRCLE_TAG" REGISTRY=$registry
              fi
            done

      - run:
          name: Push to Azure
          command: |
            docker login --username $ACR_GSOCI_USERNAME --password $ACR_GSOCI_PASSWORD "${REGISTRY_AZURE%/*}"

            make docker-push-all ALL_ARCH="$ALL_ARCH" TAG=$CIRCLE_SHA1 REGISTRY=$REGISTRY_AZURE

            if [ -n "$CIRCLE_TAG" ]; then
              echo "Pushing tag $CIRCLE_TAG"
              make docker-push-all ALL_ARCH="$ALL_ARCH" TAG="$CIRCLE_TAG" REGISTRY=$REGISTRY_AZURE
            fi
  sync:
    resource_class: giantswarm/galaxy-runner
    docker:
      - image: giantswarm-registry.cn-shanghai.cr.aliyuncs.com/giantswarm/regclient-regctl:v0.11.3-alpine
        entrypoint: ["/bin/sh"]
    environment:
      IMAGE_AZURE: gsoci.azurecr.io/giantswarm/cluster-api-aws-controller
      IMAGE_ALIYUN: giantswarm-registry.cn-shanghai.cr.aliyuncs.com/giantswarm/cluster-api-aws-controller
    steps:
       - run:
           name: Sync to Aliyun
           command: |
             regctl registry login "${IMAGE_ALIYUN%%/*}" -u $ALIYUN_USERNAME -p $ALIYUN_PASSWORD

             source_repository="${IMAGE_AZURE}:${CIRCLE_SHA1}"
             target_repository="${IMAGE_ALIYUN}:${CIRCLE_SHA1}"

             success=false
             for n in $(seq 1 10); do
               echo "Attempt ${n}"
               if regctl image copy "${source_repository}" "${target_repository}"; then
                 echo "Image successfully pushed to the registry"
                 success=true
                 break
               fi
               echo "Waiting 5 seconds before the next attempt"
               sleep 5
             done
             if [ "${success}" = "false" ]; then
               echo "Failed to sync the image"
               exit 1
             fi

workflows:
  version: 2
  build_and_update:
    jobs:
      - build:
          context:
            - architect
          # Trigger the job also on git tag
          filters:
            tags:
              only: /^v.*/
      - sync:
          requires:
            - build
          context:
            - architect
          # Trigger the job also on git tag
          filters:
            tags:
              only: /^v.*/
      - test:
          # Trigger the job also on git tag
          filters:
            tags:
              only: /^v.*/
